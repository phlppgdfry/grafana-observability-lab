services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:4310:4310"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
