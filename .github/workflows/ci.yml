name: Lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Start demo and verify full user flow
        shell: bash
        run: |
          node app/server.mjs > /tmp/document-lab.log 2>&1 &
          lab_pid=$!
          trap 'kill "$lab_pid"' EXIT
          for attempt in {1..20}; do
            if npm run check; then
              mkdir -p test-results
              node tests/user-flow.mjs > test-results/user-flow.json 2>&1
              exit 0
            fi
            sleep 1
          done
          cat /tmp/document-lab.log
          exit 1
      - name: Preserve user flow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-flow-report
          path: test-results/user-flow.json
          if-no-files-found: ignore
