# Active check ID 12093; update existing check instead of creating a duplicate.
apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: "document-lab-health-12093"
spec:
  job: document-lab-health
  target: http://document-lab.test:4310/health
  frequency: 60000
  timeout: 5000
  enabled: true
  labels:
    - name: environment
      value: lab
  probes:
    - document-lab-local
  alertSensitivity: none
  basicMetricsOnly: true
  settings:
    http:
      method: GET
      ipVersion: V4
      validStatusCodes: [200]
      noFollowRedirects: true
